services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: glassbox, POSTGRES_USER: glassbox, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U glassbox"], interval: 5s, timeout: 3s, retries: 15}
  redis:
    image: redis:7-alpine
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: { DATABASE_URL: postgresql://glassbox:${POSTGRES_PASSWORD}@postgres:5432/glassbox, REDIS_URL: redis://redis:6379, JWT_SECRET: ${JWT_SECRET}, PORT: 3000 }
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    build: {context: ., dockerfile: workers/Dockerfile}
    environment: { DATABASE_URL: postgresql://glassbox:${POSTGRES_PASSWORD}@postgres:5432/glassbox, REDIS_URL: redis://redis:6379 }
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    depends_on: [postgres,redis]
    deploy: {replicas: 2}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api,frontend]
volumes: {postgres_data: {}}
