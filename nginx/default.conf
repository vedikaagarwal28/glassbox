server { listen 80; client_max_body_size 250k;
 location /api/ { proxy_pass http://api:3000/api/; proxy_set_header Host $host; }
 location /socket.io/ { proxy_pass http://api:3000/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
 location / { proxy_pass http://frontend:80/; }
}
